<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 stops iPadOS zooming in on every focused input
         (pinch-zoom still works); viewport-fit=cover lets the layout pad
         itself with env(safe-area-inset-*). No interactive-widget: with
         resizes-content, iPad Chrome shrank the layout for the keyboard
         bar and never grew it back, leaving a blank strip at the bottom. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />

    <!-- Primary SEO. Title ≤ 60 chars, description ≤ 160 chars. Absolute
         URLs (canonical, og:url, og:image, JSON-LD) are injected at build
         time by the `bento-seo` plugin in vite.config.ts from SITE_URL. -->
    <title>Bento — Local-first notes, docs &amp; sheets in your browser</title>
    <meta
      name="description"
      content="Write Markdown notes and edit Word, Excel, PDF and CSV files right in your browser. Kanban, calendar, SQL and more. Free, offline, no account."
    />
    <meta name="application-name" content="Bento" />
    <meta name="theme-color" content="#eef3f1" />
    <meta name="color-scheme" content="light" />

    <!-- Open Graph / X link previews. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bento" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Bento — Local-first notes, docs &amp; sheets" />
    <meta
      property="og:description"
      content="Markdown, Word, Excel, PDF and CSV editors plus kanban, calendar, SQL and regex tools — all in your browser, saved offline."
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="Bento logo — local-first workspace for notes, docs, sheets, PDFs and dev tools"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bento — Local-first notes, docs &amp; sheets" />
    <meta
      name="twitter:description"
      content="Markdown, Word, Excel, PDF and CSV editors plus kanban, calendar, SQL and regex tools — all in your browser, saved offline."
    />

    <!-- Icons + install. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Bento" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-render-blocking: fetched at high priority, applied on load
         (display=swap already falls back to system fonts meanwhile). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Open+Sans:wght@400;600&family=Poppins:wght@500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Open+Sans:wght@400;600&family=Poppins:wght@500;600;700&display=swap"
      />
    </noscript>

    <!-- Boot splash: real content in the initial HTML (crawlers that don't
         run JS still see what the app is), replaced when React mounts. -->
    <style>
      /* Fixed to the viewport, not height: 100% — the app stylesheet that
         sizes html/body/#root (and drops body's 8px margin) loads after
         this paints in dev, so a percentage height collapses to content
         and the splash jumps once it arrives. */
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px;
        text-align: center;
        background: var(--app-bg, #eef3f1);
        color: var(--app-text, #2a3f3c);
        font-family: "Open Sans", system-ui, sans-serif;
      }
      /* Every size below is pinned (box-sizing, px line-height, display) so
         nothing reflows when Tailwind's preflight (border-box, line-height
         1.5, img block) or the Poppins web font arrives after first paint —
         either would change the stack's height and nudge the centre. */
      /* The loader is the logo itself, built from divs: a dark box whose
         three compartments get packed one by one, then emptied, on loop.
         Proportions mirror public/icon.svg (512 grid: 96 inset, 24 gap,
         112 outer / 28 inner radius) scaled to 64px. Brand colours are
         fixed like the icon, not themed. */
      .boot-splash__box {
        display: grid;
        box-sizing: border-box;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 3px;
        width: 64px;
        height: 64px;
        padding: 12px;
        border-radius: 14px;
        background: #183d3d;
        box-shadow: 0 6px 18px rgba(24, 61, 61, 0.18);
      }
      .boot-splash__cell {
        border-radius: 3.5px;
        animation: boot-splash-pack 2s cubic-bezier(0.34, 1.56, 0.64, 1) infinite both;
      }
      .boot-splash__cell--main {
        grid-row: 1 / 3;
        background: #eef3f1;
      }
      .boot-splash__cell--side {
        background: #93b1a6;
        animation-delay: 0.18s;
      }
      .boot-splash__cell--extra {
        background: #5c8374;
        animation-delay: 0.36s;
      }
      @keyframes boot-splash-pack {
        0% {
          opacity: 0;
          transform: scale(0.4);
        }
        22%,
        68% {
          opacity: 1;
          transform: scale(1);
        }
        86%,
        100% {
          opacity: 0;
          transform: scale(0.4);
        }
      }
      .boot-splash__title {
        margin: 4px 0 0;
        font-family: "Poppins", system-ui, sans-serif;
        font-size: 28px;
        font-weight: 600;
        line-height: 36px;
        color: var(--app-accent, #183d3d);
      }
      .boot-splash__caption {
        margin: 0;
        font-size: 13px;
        line-height: 18px;
        color: var(--app-dim, #5c8374);
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__cell {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">
        <div class="boot-splash__box" role="status" aria-label="Loading">
          <span class="boot-splash__cell boot-splash__cell--main"></span>
          <span class="boot-splash__cell boot-splash__cell--side"></span>
          <span class="boot-splash__cell boot-splash__cell--extra"></span>
        </div>
        <h1 class="boot-splash__title">Bento</h1>
        <p class="boot-splash__caption">Packing your workspace…</p>
      </div>
    </div>
    <noscript>
      <h2>Bento needs JavaScript</h2>
      <p>
        Bento is a free, local-first editor that runs entirely in your browser and saves to
        IndexedDB — no account, no server. Enable JavaScript to use it.
      </p>
      <h2>What you can open in Bento</h2>
      <ul>
        <li>Markdown notes with a rich-text editor</li>
        <li>Word (.docx), Excel (.xlsx), PDF and CSV editors and viewers</li>
        <li>Kanban boards, calendars and timers</li>
        <li>JSON, YAML, TOML, JSON Schema and Mermaid diagrams</li>
        <li>SQL against an in-browser SQLite database</li>
        <li>Regex tester, file diff, .env editor and QR code designer</li>
        <li>AI chat with Gemini or OpenRouter using your own key</li>
      </ul>
    </noscript>
    <!-- Portal target the Extend CSV viewer's overlays render into. -->
    <div id="portal" class="fixed top-0 left-0 z-40"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
